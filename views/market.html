<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 sm:gap-0">
    <div class="flex items-center gap-2 shrink-0">
        <h2 class="text-lg font-semibold text-slate-800 whitespace-nowrap">股市資料</h2>
        <button id="btn-market-refresh"
            class="bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 p-1.5 rounded-lg text-sm transition-colors flex items-center justify-center shadow-sm"
            title="依序更新如下...&#10;【整體更新】定期智慧判斷 (EPS、營收YoY、籌碼、PE/殖利率、名稱快取)&#10;【個別更新】每日一次 (歷史 K 線)&#10;【整體更新】隨時盤中 (ETF 淨值)&#10;【個別更新】隨時盤中 (即時報價、盤中走勢圖)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </button>
    </div>
    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <select id="market-add-target"
            class="w-full sm:w-28 px-2 py-1.5 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 transition-colors">
            <option value="watchList">預設自選</option>
            <!-- Custom lists will be appended here -->
        </select>
        <div class="flex gap-2 flex-1 sm:flex-none">
            <input type="text" id="market-add-input" placeholder="代號 (如: 2330)"
                class="w-full sm:w-36 px-3 py-1.5 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors uppercase">
            <button id="btn-market-batch-delete"
                class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors items-center gap-1 shadow-sm hidden">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span class="hidden sm:inline" id="btn-market-batch-delete-text">刪除 (0)</span>
            </button>
            <button id="btn-market-add"
                class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center shrink-0 gap-1 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                新增
            </button>
        </div>
    </div>
</div>

<div class="flex items-center gap-2 mb-4 text-sm text-slate-500">
    <div class="w-3 h-3 rounded-full bg-slate-300"></div>
    <span id="market-list-status">自選清單 (0 檔)</span>
    <span class="text-xs text-slate-400 ml-2 border border-slate-200 px-2 py-0.5 rounded text-red-400/80">※
        資料有時間差，僅提供參考</span>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-100">
    <!-- Tabs Bar -->
    <div id="market-tabs-wrapper"
        class="flex items-center justify-between border-b border-slate-200 bg-slate-50/50 rounded-t-xl sticky top-0 z-30">
        <div id="market-tabs" class="flex overflow-x-auto hide-scrollbar pt-2 px-2 gap-1 flex-1">
            <!-- Tabs will be rendered here dynamically -->
        </div>
        <div class="flex items-center gap-1 px-2 py-1.5 border-l border-slate-200 shrink-0 bg-slate-50/50 h-full">
            <button onclick="window.marketTab.promptAddCustomList()"
                class="text-blue-600 hover:bg-blue-50 p-1.5 rounded-lg transition-colors" title="新增自訂清單">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
            <button onclick="window.marketTab.manageCustomLists()"
                class="text-slate-400 hover:bg-slate-100 p-1.5 rounded-lg transition-colors" title="管理自訂清單">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </div>
    <div class="overflow-x-auto hide-scrollbar">
        <table class="w-full min-w-[900px] table-fixed text-left text-sm text-slate-600 whitespace-nowrap">
            <thead
                class="text-sm text-slate-700 bg-slate-100/95 backdrop-blur shadow-sm border-b border-slate-200 sticky top-0 z-20">
                <tr>
                    <th scope="col" class="px-2 py-3 w-8 text-center">
                        <input type="checkbox" id="market-select-all"
                            class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                    </th>
                    <th scope="col"
                        class="px-2 py-3 font-medium cursor-pointer select-none hover:text-blue-600 transition-colors w-[15%]"
                        onclick="window.marketTab.sortBy('code')">
                        <div class="flex items-center gap-1">代號／名稱 <span id="market-sort-icon-code"
                                class="text-blue-500 opacity-0 transition-opacity">▲</span></div>
                    </th>
                    <th scope="col" class="px-2 py-3 font-medium text-center w-[8%]">券商</th>
                    <th scope="col" class="px-2 py-3 font-medium text-right w-[8%]">現價</th>
                    <th scope="col"
                        class="px-2 py-3 font-medium text-right cursor-pointer select-none hover:text-blue-600 transition-colors w-[10%]"
                        onclick="window.marketTab.sortBy('change')">
                        漲跌／幅 <span id="market-sort-icon-change" class="text-slate-300 ml-0.5"></span>
                    </th>
                    <th scope="col"
                        class="px-2 py-3 font-medium text-right cursor-pointer select-none hover:text-blue-600 transition-colors w-[10%]"
                        onclick="window.marketTab.sortBy('volume')">
                        成交量 <span id="market-sort-icon-volume" class="text-slate-300 ml-0.5"></span>
                    </th>
                    <th scope="col" class="px-2 py-3 font-medium text-center w-[10%]"
                        title="本益比 (Price-to-Earnings, PE) / 每股淨值 (Book Value Per Share, BVPS)">PE / BVPS</th>
                    <th scope="col" class="px-2 py-3 font-medium text-center w-[10%]"
                        title="殖利率 (Dividend Yield) / 折溢價 (Premium/Discount)">Yield / Prem</th>
                    <th scope="col" class="px-2 py-3 font-medium text-center w-[9%]">時間</th>
                    <th scope="col" class="px-2 py-3 font-medium text-right text-slate-400 leading-tight w-[17%]">
                        股數／成本<br />市值／盈虧</th>
                </tr>
            </thead>
            <tbody id="market-watch-list" class="divide-y divide-slate-100">
                <tr>
                    <td colspan="10" class="px-4 py-10 text-center text-slate-400">
                        <div class="flex flex-col items-center justify-center">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-3"></div>
                            <p>載入報價中...</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
